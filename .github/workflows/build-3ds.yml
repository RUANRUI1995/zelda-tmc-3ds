name: Build 3DS

# Compile check for pull requests and the release line; publishes nothing (the
# packages are kept as workflow artifacts). Releases come from
# build-release.yml on a vX.Y.Z tag.
#
# Two baselines are built: USA (the historical package, which also plays Europe
# ROMs) and JP (its own package with a separate title ID; it plays the clean
# Japanese ROM and the Angel Team Chinese SP4 patch). A JP build carries its own
# asset baseline and data layout, so it cannot be folded into the USA binary.

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  text-table:
    name: UI text table (host test)
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # The table and the language resolution need no ARM toolchain, and a wrong
      # word breaks the bottom screen's layout: a cell holds a fixed number of
      # characters, so the test checks every column against the widest cell.
      - name: Build and run text_i18n_test
        run: |
          command -v cc > /dev/null || (apt-get update -qq && apt-get install -y -qq gcc > /dev/null)
          cc -std=c11 -Wall -Wextra -Iport port/port_text_i18n.c port/port_text_i18n_test.c \
            -o "${RUNNER_TEMP}/text_i18n_test"
          "${RUNNER_TEMP}/text_i18n_test"

  build:
    name: 3DS packages (${{ matrix.region }} baseline, debug tools)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        region: [USA, JP]
    container:
      image: devkitpro/devkitarm:20260610

    env:
      TMC3DS_REGION: ${{ matrix.region }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host tools
        run: |
          command -v cmake > /dev/null || (apt-get update -qq && apt-get install -y -qq cmake > /dev/null)
          command -v python3 > /dev/null || (apt-get update -qq && apt-get install -y -qq python3 > /dev/null)

      - name: Resolve the version
        # A clone without tags used to fall through to 0.0.0-dev+<hash>, and the
        # first sign of it was the package name on screen. Stop here instead: a
        # build that cannot name the release it descends from is not worth an
        # artifact, and the fix is one file away (platform/3ds/release_base.txt).
        run: |
          git config --global --add safe.directory '*'
          VERSION="$(sh platform/3ds/tools/version.sh)"
          echo "Resolved version: ${VERSION}"
          case "${VERSION}" in
            0.0.0*)
              echo "::error::version.sh fell back to ${VERSION}: this clone has no v*.*.* tags and platform/3ds/release_base.txt is missing or unreadable."
              exit 1
              ;;
          esac

      - name: Build CIA and 3DSX
        # A failed run otherwise only says "step failed" and leaves the reason in
        # a log that has to be downloaded by hand. Keep the full log, and on
        # failure republish its diagnostics as an annotation so the compiler
        # errors show up on the commit itself.
        run: |
          git config --global --add safe.directory '*'
          chmod +x platform/3ds/tools/bin/bannertool platform/3ds/tools/bin/makerom
          set +e
          TMC3DS_DEBUG_TOOLS=1 TMC3DS_JOBS="$(nproc)" ./platform/3ds/build.sh > "${RUNNER_TEMP}/build.log" 2>&1
          status=$?
          cat "${RUNNER_TEMP}/build.log"
          if [ "${status}" -ne 0 ]; then
            python3 platform/3ds/tools/annotate_build_log.py "${RUNNER_TEMP}/build.log" || true
          fi
          exit "${status}"

      - name: Verify build outputs and legal files
        run: |
          git config --global --add safe.directory '*'
          VERSION="$(sh platform/3ds/tools/version.sh)"
          case "${TMC3DS_REGION}" in
            USA) PKG_SUFFIX="" ;;
            *)   PKG_SUFFIX="-$(printf '%s' "${TMC3DS_REGION}" | tr '[:upper:]' '[:lower:]')" ;;
          esac
          test ! -f baserom.gba
          ! git ls-files | grep -Ei '(^|/)([^/]*\.gba|[^/]*\.sav|[^/]*\.ppu1|tmc3ds\.log|bugreport_.*)(/|$)'
          test -f "build-3ds/game/tmc-3ds-v${VERSION}.3dsx"
          test -f "build-3ds/game/tmc-3ds-v${VERSION}${PKG_SUFFIX}.cia"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: tmc-3ds-packages-${{ matrix.region }}
          if-no-files-found: error
          path: |
            build-3ds/game/tmc-3ds-v*.3dsx
            build-3ds/game/tmc-3ds-v*.cia
